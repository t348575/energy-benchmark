name: bw-rate-limited-high
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0]
  max_repeat: 5
  cpu_max_power_watts: 500

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: rand-2500m
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [1m]
      io_engines: [io_uring]
      io_depths: [1]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
      extra_options: [[--rate=2500M]]
    plots:
      - type: FioBwOverTime
        variable: io_depths
        x_label: IO Depth
      - type: FioBasic
        variables: [io_depths]
        x_label: IO Depth
  - name: rand-2000m
    repeat: 1
