name: access-patterns-randwrite
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0]
  max_repeat: 5
  cpu_max_power_watts: 500
  sleep_after_writes: 60
  sleep_between_experiments: 15

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: rand-write-limited
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randwrite
      request_sizes: [4k]
      io_engines: [io_uring]
      io_depths: [256]
      direct: true
      time_based: true
      runtime: 1800s
    plots:
      - type: FioBwOverTime
        variables: [io_depths]
      - type: FioBasic
        variables: [io_depths]
        x_label: IO Depth