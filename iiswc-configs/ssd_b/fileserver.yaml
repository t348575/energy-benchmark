name: fileserver
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0]
  max_repeat: 5
  cpu_max_power_watts: 500
  sleep_after_writes: 60

bench_args:
  - type: FioConfig
    program: ../fio/fio
  - type: FilebenchConfig

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: fileserver
    repeat: 1
    bench:
      type: Filebench
      job_file: fileserver
      vars:
        - nfiles: 1500
        - meanfilesize: 10M
      skip_format: true
      open_dir: mountpoint/fileset
      fs: [Ext4]
      runtime: 120