name: io-engine-iouring-threads
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0]
  max_repeat: 5
  cpu_max_power_watts: 500
  sleep_after_writes: 60

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: read-1
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [4k, 16k, 64k, 1m]
      io_engines: [io_uring]
      io_depths: [1]
      num_jobs: [1]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
      extra_options: [
        [--thread, --cpus_allowed=10-19, --cpus_allowed_policy=split, --fixedbufs, --registerfiles, --hipri],
        [--thread, --cpus_allowed=10-14, --cpus_allowed_policy=split, --fixedbufs, --registerfiles, --sqthread_poll, --hipri]
      ]
      job_specific_extra_options_index: 1
      job_specific_extra_options: [
        [--sqthread_poll_cpu=15]
      ]
    plots:
      - type: FioBasic
        variables: [extra_options, request_sizes]
        x_label: io_uring polling
        labels: [Polling, KernelPolling]
  - name: read-2
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [4k, 16k, 64k, 1m]
      io_engines: [io_uring]
