name: ssd-max
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0, 1, 2]
  max_repeat: 5
  cpu_max_power_watts: 500
  sleep_after_writes: 60

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: read
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: read
      request_sizes: [4m]
      io_engines: [io_uring]
      io_depths: [32]
      num_jobs: [32]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
    plots:
      - type: FioBasic
        variables: [request_sizes]
        x_label: Request size