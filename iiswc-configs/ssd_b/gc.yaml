name: gc
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0, 1]
  max_repeat: 5
  cpu_max_power_watts: 500
  sleep_after_writes: 60
  sleep_between_experiments: 15

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: 15s
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: write
      request_sizes: [64k]
      io_engines: [io_uring]
      io_depths: [16]
      direct: true
      time_based: true
      runtime: 30s
    plots:
      - type: FioBwOverTime
        variable: io_depths
  - name: 60s
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: write
      request_sizes: [64k]
      io_engines: [io_uring]
      io_depths: [16]
      direct: true
      time_based: true
      runtime: 60s
    plots:
      - type: FioBwOverTime
        variable: io_depths
  - name: 120s
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: write
      request_sizes: [64k]
      io_engines: [io_uring]
      io_depths: [16]
      direct: true
      time_based: true
      runtime: 120s
    plots:
      - type: FioBwOverTime
        variable: io_depths
  - name: 900s
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: write
      request_sizes: [64k]
      io_engines: [io_uring]
      io_depths: [16]
      direct: true
      time_based: true
      runtime: 900s
    plots:
      - type: FioBwOverTime
        variable: io_depths