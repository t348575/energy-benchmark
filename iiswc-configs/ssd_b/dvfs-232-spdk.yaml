name: dvfs-2.32ghz-spdk
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: local
  nvme_power_states: [0]
  cpu_freq:
    freq: 2320000
    default_governor: schedutil
  max_repeat: 5
  cpu_max_power_watts: 500

bench_args:
  - type: FioConfig
    program: ../fio/fio
    spdk_path: /mnt/sdb/joseph/spdk

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]

benches:
  - name: iodepth
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [4k, 1m]
      io_engines: [spdk]
      io_depths: [1, 256]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
      extra_options: [[--cpus_allowed=10, --thread]]
    plots:
      - type: FioBasic
        variables: [io_depths, request_sizes]
        x_label: IO Depth