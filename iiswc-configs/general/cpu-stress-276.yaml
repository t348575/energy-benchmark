name: cpu-stress-2.76ghz
settings:
  device: /dev/nvme1n1
  nvme_power_states: [0]
  max_repeat: 5
  numa:
    cpunodebind: 1
    membind: 1
  cpu_freq:
    freq: 2760000
    default_governor: schedutil
  cpu_max_power_watts: 500

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: stress
    repeat: 1
    bench:
      type: Cmd
      program: stress-ng
      write_hint: false
      args: [--timeout, 30, --cpu, 10]
    plots:
      - type: CmdBasic