name: io-control-cgroups
settings:
  device: /dev/nvme1n1
  nvme_power_states: [0]
  max_repeat: 5
  cpu_max_power_watts: 500
  cgroup:
    cpuset:
      cpus: [[10, null]]
    io:
      max:
        bps:
          r: 4000000000
          w: 4000000000
      cost:
        model: !User
          bps:
            r: 4000000000
            w: 4000000000
          seqiops:
            r: 976563
            w: 976563
          randiops:
            r: 976563
            w: 976563

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: read
    repeat: 1
    bench:
      type: Cmd
      program: sleep
      write_hint: false
      args: [45]
