name: io-engine-iouring-iodepth-fs
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0]
  max_repeat: 5
  cpu_max_power_watts: 500
  sleep_after_writes: 60

bench_args:
  - type: FioConfig
    program: ../fio/fio

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: read-1
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [4k, 1m]
      io_engines: [io_uring]
      io_depths: [1]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
      fs: Ext4
      skip_format: true
      filename: mountpoint/testfile
      extra_options: [
        [--cpus_allowed=10, --fixedbufs, --registerfiles, --hipri],
        [--cpus_allowed=10, --fixedbufs, --registerfiles, --sqthread_poll, --hipri, --sqthread_poll_cpu=11]
      ]
    plots:
      - type: FioBasic
        variables: [extra_options]
        x_label: io_uring polling
        labels: [Polling, KernelPolling]
