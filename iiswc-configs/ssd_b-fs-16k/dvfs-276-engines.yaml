name: dvfs-2.76ghz-engines
settings:
  device: /dev/nvme1n1
  numa:
    cpunodebind: 1
    membind: 1
  nvme_power_states: [0]
  cpu_freq:
    freq: 2760000
    default_governor: schedutil
  max_repeat: 5
  cpu_max_power_watts: 500

bench_args:
  - type: FioConfig
    program: ../fio/fio
    spdk_path: /mnt/sdb/joseph/spdk

sensors:
  - sensor: Powersensor3
    args:
      type: Powersensor3Config
      device: /dev/ttyACM0
  - sensor: Rapl
  - sensor: Sysinfo
    args:
      type: SysinfoConfig
      interval: 10
  - sensor: NetioHttp
    args:
      type: NetioHttpConfig
      pdus:
        - alias: left
          url: http://192.168.1.78/netio.json
          loads: [Node3L]
        - alias: right
          url: http://192.168.1.79/netio.json
          loads: [Node3R]
  - sensor: Diskstat

benches:
  - name: iodepth
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [4k]
      io_engines: [libaio, io_uring, io_uring]
      io_depths: [1, 256]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
      fs: Ext4
      skip_format: true
      open_dir: mountpoint/fileset
      extra_options: [[--cpus_allowed=10, --alloc-size=524288]]
      matched_args:
        io_engines[1]: [--registerfiles, --hipri]
        io_engines[2]: [--registerfiles, --sqthread_poll, --hipri, --sqthread_poll_cpu=11]
    plots:
      - type: FioBasic
        variables: [io_depths, io_engines, request_sizes]
        x_label: IO Depth
  - name: threads
    repeat: 1
    bench:
      type: Fio
      test_type:
        type: randread
      request_sizes: [4k]
      io_engines: [libaio, io_uring, io_uring]
      io_depths: [1]
      num_jobs: [1, 256]
      direct: true
      time_based: true
      runtime: 30s
      ramp_time: 15s
      fs: Ext4
      skip_format: true
      open_dir: mountpoint/fileset
      extra_options: [[--alloc-size=524288]]
      matched_args:
        io_engines[1]: [--cpus_allowed=10, --fixedbufs, --registerfiles, --hipri]
        io_engines[2]: [--cpus_allowed=10, --fixedbufs, --registerfiles, --sqthread_poll, --hipri, --sqthread_poll_cpu=11]
    plots:
      - type: FioBasic
        variables: [num_jobs, io_engines, request_sizes]
        x_label: Thread